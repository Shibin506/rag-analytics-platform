# One origin for the browser: static app + the three backends.
server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    location /graphql {
        proxy_pass http://catalog:8081/graphql;
    }

    location /api/ingest/ {
        proxy_pass http://ingest:8080/;
        client_max_body_size 4m;
    }

    location /api/rag/ {
        proxy_pass http://rag:8000/;
        # Answers stream as server-sent events: pass bytes through immediately.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
