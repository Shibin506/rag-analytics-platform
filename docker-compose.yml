# The whole platform on one machine:
#   docker compose up -d --build           # start everything
#   docker compose --profile demo run --rm loadgen   # send 14 days of events + sample docs
# Web UI http://localhost:3000 · GraphiQL http://localhost:8081/graphiql
# Airflow http://localhost:8089 (admin/admin) · Trino http://localhost:8088

x-s3-env: &s3-env
  S3_ACCESS_KEY: lumen
  S3_SECRET_KEY: lumen-secret
  S3_BUCKET: lumen-lake

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lumen
      POSTGRES_PASSWORD: lumen
      POSTGRES_DB: lumen
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/10-airflow.sql:ro
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen -d lumen"]
      interval: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:3.85
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=200 -master.volumeSizeLimitMB=64
    volumes:
      - s3data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["8333:8333"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 3s
      retries: 30

  catalog:
    build: ./services/catalog
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://postgres:5432/lumen
      TRINO_JDBC_URL: jdbc:trino://trino:8080/lake/curated
    depends_on:
      postgres: { condition: service_healthy }
    ports: ["8081:8081"]

  ingest:
    build: ./services/ingest
    environment:
      <<: *s3-env
      DATABASE_URL: postgres://lumen:lumen@postgres:5432/lumen
      S3_ENDPOINT: s3:8333
    depends_on:
      catalog: { condition: service_healthy }   # schema migrations
      s3: { condition: service_healthy }
    ports: ["8080:8080", "9090:9090"]

  rag:
    build: ./services/rag
    environment:
      <<: *s3-env
      DATABASE_URL: postgresql://lumen:lumen@postgres:5432/lumen
      S3_ENDPOINT_URL: http://s3:8333
      # Set ANTHROPIC_API_KEY to answer with Claude; without it answers are extractive.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      catalog: { condition: service_healthy }
      s3: { condition: service_healthy }
    ports: ["8000:8000"]

  trino:
    image: trinodb/trino:476
    environment:
      <<: *s3-env
      S3_ENDPOINT_URL: http://s3:8333
    volumes:
      - ./deploy/trino/catalog/lake.properties:/etc/trino/catalog/lake.properties:ro
    depends_on:
      s3: { condition: service_healthy }
    ports: ["8088:8080"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      retries: 40

  airflow:
    build: ./pipelines
    environment:
      <<: *s3-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://lumen:lumen@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__WEBSERVER__SECRET_KEY: lumen-dev-only
      S3_ENDPOINT_URL: http://s3:8333
      TRINO_HOST: trino
      TRINO_PORT: "8080"
    depends_on:
      postgres: { condition: service_healthy }
      trino: { condition: service_healthy }
    ports: ["8089:8080"]

  web:
    build: ./web
    depends_on: [catalog, ingest, rag]
    ports: ["3000:80"]

  loadgen:
    build: ./services/ingest
    profiles: ["demo"]
    entrypoint: ["loadgen", "-grpc", "ingest:9090", "-http", "http://ingest:8080", "-docs", "/samples/docs"]
    command: ["-days", "14", "-per-day", "20000"]
    volumes:
      - ./samples:/samples:ro
    depends_on: [ingest]

volumes:
  pgdata:
  s3data:
