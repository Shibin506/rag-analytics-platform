[project]
name = "lumen-rag"
version = "0.1.0"
description = "Lumen retrieval-augmented answering service"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "psycopg[binary]==3.2.9",
    "psycopg-pool==3.2.6",
    "pgvector==0.4.1",
    "numpy>=2.0,<3",
    "boto3==1.38.23",
    "anthropic>=0.80",
    "prometheus-client==0.22.0",
    "pydantic==2.11.5",
]

[project.optional-dependencies]
fastembed = ["fastembed==0.7.0"]
dev = ["pytest==8.3.5", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lumen_rag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
