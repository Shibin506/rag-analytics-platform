server:
  port: ${PORT:8081}

spring:
  application:
    name: lumen-catalog
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/lumen}
    username: ${DB_USER:lumen}
    password: ${DB_PASSWORD:lumen}
  flyway:
    locations: classpath:db/migration
  graphql:
    graphiql:
      enabled: true
    cors:
      allowed-origins: "*"
      allowed-headers: "*"
      allowed-methods: GET,POST
  threads:
    virtual:
      enabled: true

lumen:
  trino:
    url: ${TRINO_JDBC_URL:jdbc:trino://localhost:8088/lake/curated}
    user: lumen
    timeout-seconds: 20

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
