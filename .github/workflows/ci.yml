name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ingest-go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/ingest/go.sum
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  rag-python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://lumen:lumen@localhost:5432/lumen
    defaults:
      run:
        working-directory: services/rag
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Retrieval eval (fails if hybrid hit@3 drops below 0.85)
        run: python -m evals.run_eval --min-hybrid-hit3 0.85

  catalog-java:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen
          POSTGRES_DB: lumen_catalog_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lumen" --health-interval 3s --health-retries 20
    env:
      TEST_JDBC_URL: jdbc:postgresql://localhost:5432/lumen_catalog_test
    defaults:
      run:
        working-directory: services/catalog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -q test

  pipelines:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipelines
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "pyspark==3.5.5" "trino==0.333.0" pytest
      - run: pytest -q tests

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [ingest-go, rag-python, catalog-java, pipelines, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
      - run: docker compose build ingest rag catalog web airflow
      - name: Airflow DAG imports cleanly
        run: |
          docker run --rm --entrypoint python rag-analytics-platform-airflow -c \
            "from airflow.models import DagBag; b = DagBag('/opt/lumen/pipelines/dags', include_examples=False); assert not b.import_errors, b.import_errors; print(sorted(b.dags))"
