# The lake: Parquet/JSON files in S3, table metadata in a file-based Hive
# metastore kept in the same bucket (no separate metastore service to run).
connector.name=hive
hive.metastore=file
hive.metastore.catalog.dir=s3://lumen-lake/metastore
hive.metastore.disable-location-checks=true
hive.non-managed-table-writes-enabled=true
hive.non-managed-table-creates-enabled=true
hive.storage-format=PARQUET
hive.compression-codec=ZSTD
hive.partition-projection-enabled=false

fs.native-s3.enabled=true
s3.endpoint=${ENV:S3_ENDPOINT_URL}
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
